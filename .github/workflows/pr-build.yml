name: SelfPhotos PR Build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build SelfPhotos
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ImmichApp.xcodeproj \
            -scheme SelfPhotos \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
